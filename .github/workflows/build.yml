name: Desktop build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            target: aarch64-apple-darwin
            arch: arm64
          - name: macOS Intel
            target: x86_64-apple-darwin
            arch: amd64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
      - name: Build PR DMG
        if: github.event_name == 'pull_request'
        run: npm run tauri build -- --ci --target ${{ matrix.target }} --bundles dmg -- --locked
      - name: Build signed DMG
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE:?Missing CSC_LINK}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Missing CSC_KEY_PASSWORD}"
          : "${APPLE_SIGNING_IDENTITY:?Missing APPLE_SIGNING_IDENTITY}"
          npm run tauri build -- --ci --target ${{ matrix.target }} --bundles dmg -- --locked
      - name: Prepare installer artifact
        id: installer
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=("src-tauri/target/${TARGET}/release/bundle/dmg/"*.dmg)
          if [[ ${#installers[@]} -ne 1 ]]; then
            echo "Expected one DMG, found ${#installers[@]}" >&2
            exit 1
          fi
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          suffix=""
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            suffix="-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          filename="bicord-v${version}${suffix}-${ARCH}.dmg"
          mv "${installers[0]}" "src-tauri/target/${filename}"
          echo "path=src-tauri/target/${filename}" >> "$GITHUB_OUTPUT"
      - name: Notarize and verify DMG
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          INSTALLER: ${{ steps.installer.outputs.path }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          : "${APPLE_API_KEY_BASE64:?Missing APPLE_API_KEY}"
          : "${APPLE_API_KEY_ID:?Missing APPLE_API_KEY_ID}"
          : "${APPLE_API_ISSUER:?Missing APPLE_API_ISSUER}"
          codesign --verify --strict "$INSTALLER"
          umask 077
          key_path="$RUNNER_TEMP/bicord-notary.p8"
          trap 'unlink "$key_path"' EXIT
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_path"
          result=$(xcrun notarytool submit "$INSTALLER" --key "$key_path" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 20m --output-format json)
          printf '%s\n' "$result"
          jq -e '.status == "Accepted"' <<< "$result" >/dev/null
          xcrun stapler staple "$INSTALLER"
          xcrun stapler validate "$INSTALLER"
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          archive: false
          if-no-files-found: error
          path: ${{ steps.installer.outputs.path }}
